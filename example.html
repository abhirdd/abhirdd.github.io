<!DOCTYPE html>
<html>
<head>
    <title>About:Blank Fragment Test</title>
</head>
<body>
    <h2>Testing About:Blank Spoofing</h2>
    <button onclick="testAboutBlank()">Open About:Blank with Fake Fragment</button>
    
    <script>
        function testAboutBlank() {
            // 1. Buka window baru dengan about:blank
            const newWin = window.open('about:blank', '_blank');
            
            // 2. Coba manipulasi URL dengan fragment yang menyesatkan
            // Browser AKAN menampilkan: about:blank#https://google.com
            const fakeUrl = 'about:blank#https://google.com';
            
            // 3. Tulis konten palsu ke dalam window tersebut
            newWin.document.write(`
                <style>
                    body { font-family: Arial; text-align: center; padding: 50px; background: #f0f2f5; }
                    .box { background: white; padding: 40px; border-radius: 8px; display: inline-block; }
                </style>
                <div class="box">
                    <h2>Sign in to Google</h2>
                    <p>Perhatikan address bar di atas. Itu akan menampilkan:</p>
                    <code style="background:#eee; padding:5px; color:red;">about:blank#https://google.com</code>
                    <p>Bukan <strong>https://google.com</strong>.</p>
                </div>
            `);
            
            // 4. Coba ubah history (ini juga tidak akan mengubah tampilan dasar address bar)
            newWin.history.pushState({}, '', fakeUrl);
        }
    </script>
</body>
</html>
