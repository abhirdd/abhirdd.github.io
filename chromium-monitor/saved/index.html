<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved Temuan · Chromium Vuln Monitor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f1115; color: #e6e6e6; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #9aa0a6; font-size: 13px; margin: 0 0 20px; }
  a { color: #8ab4f8; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .item { background: #171a21; border: 1px solid #262a33; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .item .title { font-size: 15px; font-weight: 600; line-height: 1.35; }
  .item .meta { color: #9aa0a6; font-size: 12px; margin-top: 4px; }
  .item .links { margin-top: 8px; font-size: 12px; }
  .item .links a { margin-right: 16px; }
  .badge { display: inline-block; background: #1f2937; color: #8ab4f8; border-radius: 20px; padding: 2px 10px; font-size: 11px; margin-left: 8px; vertical-align: middle; }
  #info { color: #9aa0a6; font-size: 14px; }
  .empty { color: #9aa0a6; padding: 30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>&#128190; Saved Temuan</h1>
  <p class="sub">Daftar temuan yang sudah kamu simpan &middot; <a href="../">&#8592; kembali ke dashboard</a></p>
  <p id="info">Memuat&hellip;</p>
  <div id="list"></div>
</div>
<script>
var OWNER = 'abhirdd';
var REPO = 'abhirdd.github.io';
var DIR = 'chromium-monitor/saved';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

(function () {
  var info = document.getElementById('info');
  var list = document.getElementById('list');

  fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + DIR, { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (files) {
      var items = (Array.isArray(files) ? files : []).filter(function (f) {
        return f.type === 'file' && f.name.indexOf('.json') > -1 && f.name !== 'index.html';
      });
      if (!items.length) {
        info.textContent = '';
        list.innerHTML = '<div class="empty">Belum ada temuan tersimpan.</div>';
        return;
      }
      info.textContent = items.length + ' temuan tersimpan (terbaru di atas).';

      return Promise.all(items.map(function (f) {
        var id = f.name.replace(/\.json$/, '');
        return fetch(f.download_url)
          .then(function (fr) { return fr.json(); })
          .then(function (d) {
            var iss = (d && d.issue) || {};
            return {
              id: id,
              title: iss.title || '(tanpa judul)',
              saved_at: (d && d.saved_at) || '',
              category: (d && d.category) || '',
              json: f.download_url,
              url: (d && d.issue_url) || iss.url || ('https://issues.chromium.org/issues/' + id)
            };
          })
          .catch(function () {
            return {
              id: id,
              title: '(gagal membaca file)',
              saved_at: '',
              category: '',
              json: f.download_url,
              url: 'https://issues.chromium.org/issues/' + id
            };
          });
      }));
    })
    .then(function (rows) {
      rows.sort(function (a, b) { return String(b.saved_at || '').localeCompare(String(a.saved_at || '')); });
      list.innerHTML = rows.map(function (x) {
        return '<div class="item">' +
          '<div class="title"><a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title) + '</a><span class="badge">#' + esc(x.id) + '</span></div>' +
          '<div class="meta">' + (x.category ? esc(x.category) + ' &middot; ' : '') + (x.saved_at ? 'disimpan ' + esc(x.saved_at) : '') + '</div>' +
          '<div class="links"><a href="' + esc(x.url) + '" target="_blank" rel="noopener">Lihat di Issue Tracker &nearr;</a><a href="' + esc(x.json) + '" target="_blank" rel="noopener">JSON</a></div>' +
          '</div>';
      }).join('');
    })
    .catch(function (e) {
      info.textContent = 'Gagal memuat daftar: ' + e.message;
    });
})();
</script>
</body>
</html>
