<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tech 8 – No download attr</title>
<style>/* same */</style>
</head>
<body>
<h2>Bypass Multiple Download</h2>
<button onclick="run()">Execute Injection</button>
<pre id="out" style="margin:10px auto;width:100%;text-align:left;"></pre>
<script>
function download(name, content){
  // catat nama tapi TIDAK mengirimkannya ke atribut download
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:'application/octet-stream'}));
  // a.download = name; // DIBUAT KOSONG
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function run(){
  download('main_context.txt','Main content');
  setTimeout(()=>{
    const win=window.open('', '_blank');
    if(win){
      win.document.write(`<script>setTimeout(()=>{const a=document.createElement('a');
        a.href=URL.createObjectURL(new Blob(['Injected content'],{type:'application/octet-stream'}));
        // a.download='injected_context.txt'; // juga dihilangkan
        document.body.appendChild(a);a.click();},300);<\/script>`);
      win.document.close();
    }
  },500);
  document.getElementById('out').innerText='Downloads saved with generic names (no .txt shown)';
}
</script>
</body>
</html>
