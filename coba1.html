<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tech 5 – Data URI</title>
<style>/* same */</style>
</head>
<body>
<h2>Bypass Multiple Download</h2>
<button onclick="run()">Execute Injection</button>
<pre id="out" style="margin:10px auto;width:100%;text-align:left;"></pre>
<script>
function run(){
  // main: encode ke base64 dan taruh di data: URI
  const mainB64=btoa('Main content');
  const a=document.createElement('a');
  a.href='data:text/plain;base64,'+mainB64;
  a.download='main_context.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  document.getElementById('out').innerText='Main via data: URI';

  // injected di window baru
  setTimeout(()=>{
    const win=window.open('', '_blank');
    if(win){
      win.document.write(`<script>setTimeout(()=>{
        const injB64=btoa('Injected content');
        const a=document.createElement('a');
        a.href='data:text/plain;base64,'+injB64;
        a.download='injected_context.txt';
        document.body.appendChild(a);a.click();},300);<\/script>`);
      win.document.close();
    }
  },500);
}
</script>
</body>
</html>
