<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tech 2 – Double‑extension</title>
<style>/* same styles as above */</style>
</head>
<body>
<h2>Tech 2 – Double‑extension</h2>
<button onclick="run()">Download as calculator.exe.txt</button>
<pre id="out" style="margin-top:10px;"></pre>
<script>
function run(){
  const txt = '@echo off\nstart calc.exe';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'text/plain'}));
  a.download = 'calculator.exe.txt';   // double extension
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  document.getElementById('out').innerText = 'Downloaded as calculator.exe.txt (double‑ext)';
}
</script>
</body>
</html>
