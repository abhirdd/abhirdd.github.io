<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tech 3 – Fetch external</title>
<style>/* same */</style>
</head>
<body>
<h2>Bypass Multiple Download</h2>
<button onclick="run()">Execute Injection</button>
<pre id="out" style="margin:10px auto;width:100%;text-align:left;"></pre>
<script>
function run(){
  // main download dari example.com
  fetch('https://example.com/main_context.txt')
    .then(r=>r.blob())
    .then(blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='main_context.txt';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      document.getElementById('out').innerText='Main downloaded from example.com';
    });
  // injected download di window baru (serupia tapi sumber luar)
  setTimeout(()=>{
    const win=window.open('', '_blank');
    if(win){
      win.document.write(`<script>setTimeout(()=>{
        fetch('https://example.com/injected_context.txt')
          .then(r=>r.blob()).then(blob=>{
            const a=document.createElement('a');
            a.href=URL.createObjectURL(blob);
            a.download='injected_context.txt';
            document.body.appendChild(a);a.click();
          });
      },300);<\/script>`);
      win.document.close();
    }
  },500);
}
</script>
</body>
</html>
