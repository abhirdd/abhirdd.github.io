<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tech 4 – msSaveOrOpenBlob</title>
<style>/* same styles */</style>
</head>
<body>
<h2>Tech 4 – msSaveOrOpenBlob (IE/Edge legacy)</h2>
<button onclick="run()">Save with msSaveOrOpenBlob</button>
<pre id="out" style="margin-top:10px;"></pre>
<script>
function run(){
  if (navigator.msSaveOrOpenBlob) {
    const blob = new Blob(['@echo off\nstart calc.exe'], {type:'application/octet-stream'});
    navigator.msSaveOrOpenBlob(blob, 'calculator.exe');
    document.getElementById('out').innerText = 'msSaveOrOpenBlob triggered';
  } else {
    document.getElementById('out').innerText = 'Not supported in this browser';
  }
}
</script>
</body>
</html>
