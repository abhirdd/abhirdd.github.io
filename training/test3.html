<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>03 window.open whitespace</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #0f172a; color: #e5e7eb; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }
    pre { background: #020617; border: 1px solid #334155; padding: 14px; border-radius: 10px; white-space: pre-wrap; margin-top: 16px; }
    .empty { color: #f87171; font-weight: 700; }
    .ok { color: #4ade80; font-weight: 700; }
  </style>
</head>
<body>
  <h2>03 — window.open whitespace</h2>
  <p>Teknik: probe URL berupa spasi <code>" "</code> untuk melihat normalisasi parser.</p>
  <button onclick="run()">Run</button>
  <pre id="out">Ready.</pre>

  <script>
    async function run() {
      const out = document.getElementById("out");
      out.textContent = "Running...";

      const w = window.open(" ", "_blank", "location=no,width=900,height=600");

      await new Promise(r => setTimeout(r, 300));

      if (!w) {
        out.textContent = "Result: popup blocked / null reference.\nStatus: BLOCKED";
        return;
      }

      try {
        const href = w.location.href;
        const isEmpty = href === "";

        out.innerHTML =
          "href=" + href + "\n" +
          "empty=" + isEmpty + "\n" +
          "status=" + (isEmpty ? "EMPTY_URL_OBSERVED" : "NORMALIZED_OR_SECURE") + "\n\n" +
          "Manual check:\n" +
          "- Apakah spasi di-trim?\n" +
          "- Apakah jadi about:blank?\n" +
          "- Apakah address bar menampilkan URL aneh?";

        if (isEmpty) out.innerHTML += "\n\n" + '<span class="empty">ESCALATE: empty URL observed.</span>';
        else out.innerHTML += "\n\n" + '<span class="ok">Looks normalized / secure from JS perspective.</span>';
      } catch (e) {
        out.textContent = "ACCESS_DENIED: " + e.message;
      }
    }
  </script>
</body>
</html>
