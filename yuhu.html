<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-Browser Download Test (Firefox)</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 540px; margin: 40px auto; padding: 0 16px;
  }
  h2 { text-align: center; margin-bottom: 4px; }
  .hint { font-size: 13px; opacity: .75; text-align: center; margin-bottom: 20px; }
  button {
    width: 100%; padding: 12px; margin-bottom: 10px;
    background: #0056b3; color: #fff; border: none; border-radius: 6px;
    cursor: pointer; font-size: 14px;
  }
  button.secondary { background: #4a4a4a; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #log {
    background: #101010; color: #43d17a;
    font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace;
    padding: 10px; border-radius: 6px; height: 170px;
    overflow: auto; white-space: pre-wrap; margin-top: 12px;
  }
</style>
</head>
<body>

<h2>Cross-Browser Download Test</h2>
<p class="hint">Uji di Firefox — tiap tombol memakai metode berbeda.</p>

<button data-method="direct">1) Direct Blob Download</button>
<button data-method="popup">2) Popup (sinkron) + Blob Download</button>
<button data-method="datauri" class="secondary">3) Data-URI Fallback</button>
<button data-method="multi" class="secondary">4) Multiple Downloads (2 file)</button>

<pre id="log"></pre>

<script>
(function () {
  'use strict';

  /* ---------- Payload: isi file .bat ---------- */
  var BAT_LINES = [
    '@echo off',
    'title Calculator Launcher - Debug',
    'echo ================================',
    'echo  Calculator launch test',
    'echo ================================',
    'echo.',
    'echo [0] Checking calc.exe path...',
    'if exist "C:\\Windows\\System32\\calc.exe" (',
    '    echo     OK: calc.exe found',
    ') else (',
    '    echo     FAILED: calc.exe NOT found in System32',
    ')',
    'echo.',
    'echo [1] Launching System32\\calc.exe...',
    'start "" "C:\\Windows\\System32\\calc.exe"',
    'timeout /t 2 >nul',
    'echo.',
    'echo [2] Launching calc.exe alias...',
    'start "" calc.exe',
    'timeout /t 2 >nul',
    'echo.',
    'echo [3] Launching calculator:// protocol...',
    'start "" "calculator://"',
    'timeout /t 2 >nul',
    'echo.',
    'echo [4] Launching UWP AUMID via explorer...',
    'explorer.exe "shell:AppsFolder\\Microsoft.WindowsCalculator_8wekyb3d8bbwe!App"',
    'timeout /t 2 >nul',
    'echo.',
    'echo [5] Launching via PowerShell...',
    'powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process calc.exe"',
    'echo.',
    'echo ================================',
    'echo  Done. Did the Calculator open?',
    'echo  If NOT, take a screenshot of this window.',
    'echo ================================',
    'pause'
  ];
  var BAT_TEXT = BAT_LINES.join('\r\n') + '\r\n';
  var FILE_NAME = 'open_cmd.bat';
  var MIME = 'application/octet-stream';

  /* ---------- Log helper ---------- */
  var logEl = document.getElementById('log');
  function log(msg) {
    var t = new Date().toLocaleTimeString();
    logEl.textContent += '[' + t + '] ' + msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  /* ---------- Metode inti: <a download> + Blob ---------- */
  function saveBlob(doc, text, name, mime) {
    doc = doc || document;
    var url = URL.createObjectURL(new Blob([text], { type: mime || MIME }));
    var a = doc.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    a.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;';
    doc.body.appendChild(a);
    a.click();
    // Firefox: jangan hapus/revoke terlalu cepat, download bisa gagal
    setTimeout(function () { if (a.parentNode) a.parentNode.removeChild(a); }, 1000);
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    return url;
  }

  /* ---------- Metode 3: data: URI ---------- */
  function toDataUri(text, mime) {
    var bytes = new TextEncoder().encode(text);
    var bin = '';
    var CHUNK = 0x8000;
    for (var i = 0; i < bytes.length; i += CHUNK) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return 'data:' + (mime || MIME) + ';base64,' + btoa(bin);
  }

  function saveDataUri(text, name, mime) {
    var a = document.createElement('a');
    a.href = toDataUri(text, mime);
    a.download = name;
    a.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { if (a.parentNode) a.parentNode.removeChild(a); }, 1000);
  }

  /* ---------- Metode 2: popup dibuka SINKRON ---------- */
  function popupDownload() {
    // PENTING: window.open() harus dipanggil langsung di handler klik.
    // Kalau lewat setTimeout, Firefox menganggap user-gesture sudah hilang
    // dan memblokir popup.
    var win = window.open('', 'dl_test_popup', 'width=540,height=420');
    if (!win || win.closed || typeof win.document === 'undefined') {
      log('POPUP DIBLOKIR Firefox -> fallback ke direct download.');
      saveBlob(document, BAT_TEXT, FILE_NAME);
      return;
    }
    log('Popup berhasil dibuka: "' + win.name + '"');

    var doc = win.document;
    doc.open();
    doc.write('<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">' +
              '<title>Download siap</title></head><body></body></html>');
    doc.close();

    var h = doc.createElement('h3');
    h.textContent = 'Download siap';
    h.style.cssText = 'font-family:system-ui,sans-serif;margin:12px';

    var p = doc.createElement('p');
    p.textContent = 'Kalau download tidak mulai otomatis, klik tombol di bawah.';
    p.style.cssText = 'font-family:system-ui,sans-serif;font-size:13px;margin:12px';

    var btn = doc.createElement('button');
    btn.textContent = 'Download ' + FILE_NAME;
    btn.style.cssText = 'margin:0 12px;padding:10px 16px;cursor:pointer';
    btn.addEventListener('click', function () {
      saveBlob(doc, BAT_TEXT, FILE_NAME);
      log('Download manual dipicu dari popup.');
    });

    var pre = doc.createElement('pre');
    pre.textContent = BAT_TEXT;            // textContent = aman, tidak dieksekusi
    pre.style.cssText = 'font:11px/1.4 ui-monospace,monospace;white-space:pre-wrap;' +
                        'border:1px solid #bbb;border-radius:4px;padding:8px;' +
                        'margin:12px;max-height:180px;overflow:auto';

    doc.body.appendChild(h);
    doc.body.appendChild(p);
    doc.body.appendChild(btn);
    doc.body.appendChild(pre);

    // Auto-trigger dari dalam window popup
    win.setTimeout(function () {
      try {
        saveBlob(doc, BAT_TEXT, FILE_NAME);
        log('Auto-download dipicu dari popup.');
      } catch (e) {
        log('Auto-download gagal: ' + e.message);
      }
    }, 300);
  }

  /* ---------- Metode 4: multiple downloads ---------- */
  function multipleDownload() {
    var files = [
      { name: FILE_NAME,          text: BAT_TEXT },
      { name: 'readme_test.txt',  text: 'Multi-download test.\r\nFile kedua.\r\n' }
    ];
    // Sengaja dipicu sinkron dalam satu handler klik, supaya kelihatan
    // perilaku Firefox: prompt "Allow site to download multiple files?"
    files.forEach(function (f, i) {
      saveBlob(document, f.text, f.name);
      log('File ' + (i + 1) + '/' + files.length + ' dipicu: ' + f.name);
    });
    log('Kalau muncul prompt "Allow multiple downloads" -> klik Allow.');
  }

  /* ---------- Router ---------- */
  var busy = false;

  function run(method) {
    if (busy) { log('Masih memproses, tunggu sebentar...'); return; }
    busy = true;
    var btns = document.querySelectorAll('button[data-method]');
    btns.forEach(function (b) { b.disabled = true; });

    try {
      switch (method) {
        case 'direct':
          saveBlob(document, BAT_TEXT, FILE_NAME);
          log('Direct Blob: download "' + FILE_NAME + '" dipicu.');
          break;

        case 'popup':
          popupDownload();
          break;

        case 'datauri':
          saveDataUri(BAT_TEXT, FILE_NAME);
          log('Data-URI: download "' + FILE_NAME + '" dipicu.');
          break;

        case 'multi':
          multipleDownload();
          break;

        default:
          log('Metode tidak dikenal: ' + method);
      }
    } catch (e) {
      log('ERROR: ' + e.message);
    } finally {
      setTimeout(function () {
        busy = false;
        btns.forEach(function (b) { b.disabled = false; });
      }, 1500);
    }
  }

  document.querySelectorAll('button[data-method]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      run(btn.getAttribute('data-method'));
    });
  });

  log('Siap. Firefox: popup harus dibuka sinkron saat klik.');
  log('Cek juga about:preferences > Downloads kalau ada prompt.');
})();
</script>

</body>
</html>
