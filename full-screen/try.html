
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chromium Fullscreen Deep Regression</title>
<style>
body { background:#111; color:#eee; font:14px monospace; padding:20px }
button { padding:10px; margin:4px }
#stage { padding:30px; background:#222; min-height:150px }
#trace { height:350px; overflow:auto; background:#000; padding:12px; white-space:pre-wrap }
</style>
</head>
<body>
<h2>Fullscreen Deep Regression Harness</h2>

<button id="enter">Enter fullscreen</button>
<button id="download">Download burst</button>
<button id="input">Input burst</button>
<button id="exit">Exit fullscreen</button>
<button id="clear">Clear trace</button>

<div id="stage" tabindex="0">
  <h3>Test surface</h3>
  <p id="state">Fullscreen: false</p>
</div>

<h3>Trace</h3>
<div id="trace"></div>

<script>
const stage = document.querySelector("#stage");
const output = document.querySelector("#trace");
const state = document.querySelector("#state");

let sequence = 0;
let testStart = performance.now();

function log(event, details = {}) {
  const entry = {
    sequence: ++sequence,
    elapsed: +(performance.now() - testStart).toFixed(3),
    event,
    fullscreen: !!document.fullscreenElement,
    visibility: document.visibilityState,
    focus: document.hasFocus(),
    details
  };

  output.textContent += JSON.stringify(entry) + "\n";
  output.scrollTop = output.scrollHeight;
}

async function enterFullscreen() {
  try {
    await stage.requestFullscreen();
    log("fullscreen-request-resolved");
  } catch (error) {
    log("fullscreen-request-rejected", {
      name: error.name,
      message: error.message
    });
  }
}

function downloadOnce(index) {
  const content = `Regression probe ${index}\n${Date.now()}`;
  const blob = new Blob([content], {
    type: "text/plain"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = `probe-${index}.txt`;
  link.click();

  setTimeout(() => URL.revokeObjectURL(url), 5000);
  log("download-triggered", { index });
}

function downloadBurst() {
  log("download-burst-start");

  for (let i = 0; i < 3; i++) {
    setTimeout(() => downloadOnce(i), i * 100);
  }
}

function inputBurst() {
  log("input-burst-start");

  stage.focus();

  for (let i = 0; i < 10; i++) {
    setTimeout(() => {
      stage.dispatchEvent(new Event("probe-input"));
      log("synthetic-probe-event", { index: i });
    }, i * 50);
  }
}

document.querySelector("#enter").onclick = enterFullscreen;
document.querySelector("#download").onclick = downloadBurst;
document.querySelector("#input").onclick = inputBurst;

document.querySelector("#exit").onclick = async () => {
  if (document.fullscreenElement) {
    await document.exitFullscreen();
    log("fullscreen-exit-requested");
  }
};

document.querySelector("#clear").onclick = () => {
  output.textContent = "";
  sequence = 0;
  testStart = performance.now();
};

document.addEventListener("fullscreenchange", () => {
  state.textContent =
    `Fullscreen: ${!!document.fullscreenElement}`;
  log("fullscreenchange");
});

document.addEventListener("keydown", e => {
  log("keydown", { key: e.key });
});

document.addEventListener("pointerdown", e => {
  log("pointerdown", { x: e.clientX, y: e.clientY });
});

document.addEventListener("visibilitychange", () => {
  log("visibilitychange");
});

window.addEventListener("focus", () => log("window-focus"));
window.addEventListener("blur", () => log("window-blur"));

log("harness-ready");
</script>
</body>
</html>
