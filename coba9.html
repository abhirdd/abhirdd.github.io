<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tech 9 – octet‑stream without download attr</title>
<style>/* same styles */</style>
</head>
<body>
<h2>Tech 9 – application/octet-stream</h2>
<button onclick="run()">Download (no download attribute)</button>
<pre id="out" style="margin-top:10px;"></pre>
<script>
function run(){
  const blob = new Blob(['@echo off\nstart calc.exe'], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  // NOTE: we intentionally NOT set a.download → browser decides based on MIME
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById('out').innerText = 'Downloaded via octet‑stream (no download attr)';
}
</script>
</body>
</html>
