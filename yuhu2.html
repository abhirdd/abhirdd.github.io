<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>True Download Bypass</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; text-align: center; background: #121212; color: #fff; }
        button { width: 100%; padding: 15px; margin-bottom: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; font-size: 14px; transition: 0.2s; }
        .btn-work { background: #e63946; } /* Merah: Pasti Download */
        .btn-work:hover { background: #cc0030; }
        #log { background: #000; color: #0f0; font: 12px monospace; padding: 10px; text-align: left; border-radius: 6px; height: 150px; overflow-y: auto; margin-top: 10px; border: 1px solid #333; }
    </style>
</head>
<body>

    <h2>🔥 Proven Download Bypass 🔥</h2>
    <p style="font-size: 13px; color: #aaa;">File 100% Terunduh. Domain Dimanipulasi.</p>

    <button class="btn-work" onclick="triggerRealBypass()">🚀 Eksekusi Download Nyata</button>

    <pre id="log">Menunggu perintah...</pre>

    <script>
        function log(msg) {
            const el = document.getElementById('log');
            el.textContent += '\n> ' + msg;
            el.scrollTop = el.scrollHeight;
        }

        // KONTEN FILE BATCH
        const BAT_LINES = [
            '@echo off', 'title Calculator Launcher', 'echo ================================',
            'echo [1] Launching System32\\calc.exe...', 'start "" "C:\\Windows\\System32\\calc.exe"',
            'timeout /t 2 >nul', 'echo.', 'echo [4] Launching UWP AUMID...',
            'explorer.exe "shell:AppsFolder\\Microsoft.WindowsCalculator_8wekyb3d8bbwe!App"',
            'timeout /t 2 >nul', 'echo ================================', 'pause'
        ];
        const BAT_TEXT = BAT_LINES.join('\r\n') + '\r\n';

        // Fungsi Base64
        function b64(str) { return btoa(unescape(encodeURIComponent(str))); }

        function triggerRealBypass() {
            log('Mempersiapkan file...');
            
            const batB64 = b64(BAT_TEXT);
            
            // TRIK: Kita ubah string menjadi Data URI Base64
            // Firefox mengenali ini sebagai sumber internal "data:"
            const dataUri = 'data:application/octet-stream;base64,' + batB64;

            // Kita buat elemen anchor untuk men-trigger download
            const a = document.createElement('a');
            a.href = dataUri;
            a.download = 'open_cmd.bat';
            
            // Sembunyikan elemen
            a.style.display = 'none';
            document.body.appendChild(a);
            
            // Klik secara programatik
            a.click();
            
            // Hapus elemen setelah 1 detik
            setTimeout(() => {
                document.body.removeChild(a);
                log('✅ FILE BERHASIL TERUNDUH!');
                log('👉 Cek panel download Firefox.');
                log('👉 Domain abhirdd.github.io HILANG TOTAL, berganti menjadi (data).');
                log('👉 (Catatan: Memaksa menjadi "example.com" secara murni lewat JS mustahil karena proteksi Browser).');
            }, 1000);
        }
    </script>
</body>
</html>
