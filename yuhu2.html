<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>True Domain Changer</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; text-align: center; background: #121212; color: #fff; }
        button { width: 100%; padding: 14px; margin-bottom: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; font-size: 14px; transition: 0.2s; }
        .btn-upload { background: #ff5722; } /* Oren: Upload ke server luar */
        .btn-cname { background: #4caf50; } /* Hijau: Cara Custom Domain */
        .btn-upload:hover { background: #e64a19; }
        #log { background: #000; color: #0f0; font: 12px monospace; padding: 10px; text-align: left; border-radius: 6px; height: 150px; overflow-y: auto; margin-top: 10px; border: 1px solid #333; }
    </style>
</head>
<body>

    <h2>🔥 True External Domain Bypass 🔥</h2>
    <p style="font-size: 13px; color: #aaa;">Ubah domain di panel download Firefox secara nyata!</p>

    <button class="btn-upload" onclick="triggerExternalUpload()">🚀 1. Upload ke Server Luar (Domain Berubah)</button>
    <button class="btn-cname" onclick="showCnameTutorial()">🌐 2. Rahasia Custom Domain example.com</button>

    <pre id="log">Menunggu perintah...</pre>

    <script>
        function log(msg) {
            const el = document.getElementById('log');
            el.textContent += '\n> ' + msg;
            el.scrollTop = el.scrollHeight;
        }

        // KONTEN FILE BATCH
        const BAT_LINES = [
            '@echo off', 'title Calculator Launcher', 'echo ================================',
            'echo [1] Launching System32\\calc.exe...', 'start "" "C:\\Windows\\System32\\calc.exe"',
            'timeout /t 2 >nul', 'echo.', 'echo [4] Launching UWP AUMID...',
            'explorer.exe "shell:AppsFolder\\Microsoft.WindowsCalculator_8wekyb3d8bbwe!App"',
            'timeout /t 2 >nul', 'echo ================================', 'pause'
        ];
        const BAT_TEXT = BAT_LINES.join('\r\n') + '\r\n';

        // ==========================================
        // TRIK 1: UPLOAD KE SERVER LUAR (tmpfiles.org)
        // ==========================================
        async function triggerExternalUpload() {
            log('Menyiapkan file untuk di-upload...');
            
            const formData = new FormData();
            const blob = new Blob([BAT_TEXT], { type: 'application/octet-stream' });
            formData.append('file', blob, 'open_cmd.bat');

            try {
                log('Mengirim ke tmpfiles.org...');
                
                // Kita menggunakan API publik tmpfiles.org
                const res = await fetch('https://tmpfiles.org/api/v1/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();

                if (data.status === 'success') {
                    // Ubah URL menjadi Direct Download Link
                    const rawUrl = data.data.url;
                    const directUrl = rawUrl.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
                    
                    log('✅ Upload Sukses!');
                    log('Memicu download dari domain: tmpfiles.org');
                    
                    // Trigger download asli dari domain tmpfiles.org
                    const a = document.createElement('a');
                    a.href = directUrl;
                    a.download = 'open_cmd.bat';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    log('👉 Cek panel download Firefox. Domain abhirdd.github.io HILANG, berganti jadi tmpfiles.org!');
                } else {
                    log('❌ API menolak file.');
                }
            } catch (e) {
                log('❌ Error Jaringan/CORS: ' + e.message);
            }
        }

        // ==========================================
        // TRIK 2: CARA MENDAPATKAN DOMAIN ASLI (CNAME)
        // ==========================================
        function showCnameTutorial() {
            log('--- TUTORIAL CUSTOM DOMAIN ---');
            log('1. Anda TIDAK BISA memalsukan example.com via JS.');
            log('2. Tapi Anda BISA MEMILIKINYA secara gratis!');
            log('3. Buka Freenom.com atau isi domain murah (.my.id).');
            log('4. Di repo GitHub Anda, buat file "CNAME" isinya domain Anda.');
            log('5. Atur DNS di penyedia domain ke GitHub Pages.');
            log('6. Setelah aktif, semua download dari web Anda akan menampilkan domain milik Anda sendiri (bukan github.io).');
        }
    </script>
</body>
</html>
